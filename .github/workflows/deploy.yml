name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - jamil

env:
  IMAGE_NAME: ghcr.io/ai-knights/neworkx-dashboard

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ai-knights/neworkx-dashboard:latest
            ghcr.io/ai-knights/neworkx-dashboard:${{ github.sha }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          port: ${{ secrets.VPS_PORT }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            IMAGE_NAME=ghcr.io/ai-knights/neworkx-dashboard

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USERNAME }} --password-stdin

            docker pull $IMAGE_NAME:latest

            docker stop neworkx-dashboard || true
            docker rm neworkx-dashboard || true

            docker run -d \
              --name neworkx-dashboard \
              -p 3000:3000 \
              --restart always \
              $IMAGE_NAME:latest
