name: Manual Deploy Frontend (with version)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Docker image version (example: 1.0.0)"
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:${{ github.event.inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/rbwoodruff_frontend
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:${{ github.event.inputs.version }}
            docker tag \
              ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:${{ github.event.inputs.version }} \
              ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:latest
            docker compose up -d
