name: Deploy Frontend (hayat)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image version (e.g., 1.0.0, v2.1.0)'
        required: true
        default: 'latest'
        type: string

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: hayat  # Always checkout the hayat branch

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:${{ github.event.inputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/rbwoodruff_frontend
            
            VERSION="${{ github.event.inputs.version }}"
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:$VERSION
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:$VERSION ${{ secrets.DOCKERHUB_USERNAME }}/rbwoodruff-frontend:latest
            docker compose down
            docker compose up -d
            docker image prune -f
