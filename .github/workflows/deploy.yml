name: Deploy Frontend (hayat)

on:
  push:
    branches:
      - hayat

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1️⃣ Build Docker image locally on runner
      - name: Build Docker image
        run: |
          docker build -t rbwoodruff-frontend:latest .

      # 2️⃣ Save image to tar file
      - name: Save Docker image
        run: |
          docker save rbwoodruff-frontend:latest -o rbwoodruff-frontend.tar

      # 3️⃣ Copy image to server
      - name: Copy image to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "rbwoodruff-frontend.tar"
          target: "/root/rbwoodruff_frontend"

      # 4️⃣ SSH into server, load image & deploy
      - name: Deploy on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /root/rbwoodruff_frontend
            docker load -i rbwoodruff-frontend.tar
            docker compose down
            docker compose up -d
